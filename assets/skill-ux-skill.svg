<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="UX Skill — Claude skill">
<style>.sp{transform-origin:84px 84px;animation:sp 12s linear infinite} @keyframes sp{to{transform:rotate(360deg)}}
.sh{animation:sh 7s linear infinite} @keyframes sh{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d97757"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1200" height="210" rx="20"/></clipPath>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="50"/></filter></defs>
<g clip-path="url(#r)">
<rect width="1200" height="210" fill="#0b0b12"/>
<circle cx="84" cy="84" r="90" fill="#d97757" opacity=".25" filter="url(#bl)"/>
<circle cx="1140" cy="210" r="110" fill="#a78bfa" opacity=".2" filter="url(#bl)"/>
<rect class="sh" width="1200" height="210" fill="url(#s)" style="animation-delay:-0s"/>
</g>
<rect x="1" y="1" width="1198" height="208" rx="19" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="36" y="36" width="96" height="96" rx="24" fill="#d97757" fill-opacity=".12" stroke="#d97757" stroke-opacity=".5"/>
<g class="sp"><polygon points="84.0,48.0 59.3,54.5 66.0,79.2 48.0,61.0 30.0,79.2 36.7,54.5 12.0,48.0 36.7,41.5 30.0,16.8 48.0,35.0 66.0,16.8 59.3,41.5" transform="translate(36 36)" fill="#d97757"/></g>
<text x="160" y="80" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="800" fill="url(#g)">UX Skill</text>

<text x="160" y="118" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9ca3af">Senior-UX-designer judgment for Claude: usability, a11y, forms, dark patterns &amp; site audits.</text>
