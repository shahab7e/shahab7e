<style>
.o{animation:drift 14s ease-in-out infinite alternate} .o2{animation-duration:18s;animation-direction:alternate-reverse} .o3{animation-duration:11s}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(160px,40px)}100%{transform:translate(-120px,-30px)}}
.tw{fill:#fff;animation:tw 4s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.grid line{stroke:#a78bfa;stroke-width:1}
.hl{animation:hl 4s cubic-bezier(.6,0,1,.5) infinite} @keyframes hl{from{transform:translateY(0);opacity:0}to{transform:translateY(108px);opacity:1}}
.gl{opacity:0;animation:gl 5s steps(1) infinite} .b{animation-delay:.08s} .c{animation-delay:.16s}
@keyframes gl{0%,84%{opacity:0;transform:none}85%{opacity:.85;transform:translate(-10px,0)}87%{transform:translate(8px,0)}89%{transform:translate(-4px,0)}91%{transform:translate(12px,0)}93%,100%{opacity:0;transform:none}}
.w{font:500 26px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#f472b6;opacity:0;animation:w 12s infinite}
@keyframes w{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.dot{animation:p 1.6s ease-out infinite;transform-origin:62px 40px} @keyframes p{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
