<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="thanks for stopping by">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="600" spreadMethod="reflect">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
<rect x="100" y="20" width="1000" height="2" rx="1" fill="url(#g)"/>
<text x="600.0" y="66" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace" font-size="20" fill="#9ca3af">thanks for stopping by ✦ built with prompts, vibes &amp; too much coffee</text>
</svg>