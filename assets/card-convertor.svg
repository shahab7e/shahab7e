<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="convertor">
<style>.sh{animation:sh 6s linear infinite} @keyframes sh{from{transform:translateX(-560px)}to{transform:translateX(560px)}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="560" height="190" rx="18"/></clipPath>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<g clip-path="url(#r)">
<rect width="560" height="190" fill="#0b0b12"/>
<circle cx="520" cy="10" r="90" fill="url(#g)" opacity=".35" filter="url(#bl)"/>
<rect class="sh" width="560" height="190" fill="url(#s)" style="animation-delay:-3.0s"/>
</g>
<rect x="1" y="1" width="558" height="188" rx="17" fill="none" stroke="url(#g)" stroke-opacity=".55" stroke-width="1.5"/>
<text x="32" y="58" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="url(#g)">convertor</text>
<text x="528" y="58" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace" font-size="22" fill="#6b7280">↗</text>
<text x="32" y="102" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9ca3af">Rial ⇄ Hryvnia currency converter,</text><text x="32" y="128" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9ca3af">vibe-coded in Google AI Studio.</text><rect x="32" y="146" width="116" height="26" rx="13" fill="#3178c6" fill-opacity=".12" stroke="#3178c6" stroke-opacity=".45"/><circle cx="46" cy="159" r="4" fill="#3178c6"/><text x="56" y="164" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace" font-size="13" fill="#d1d5db">TypeScript</text><rect x="158.0" y="146" width="107" height="26" rx="13" fill="#4285f4" fill-opacity=".12" stroke="#4285f4" stroke-opacity=".45"/><circle cx="172.0" cy="159" r="4" fill="#4285f4"/><text x="182.0" y="164" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace" font-size="13" fill="#d1d5db">AI Studio</text>
</svg>